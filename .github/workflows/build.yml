name: Build mini-tool ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install font subsetting support
        run: python -m pip install 'fonttools[woff]'
      - name: Build and audit offline ZIP
        run: python scripts/build.py
      - name: Upload mini-tool ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xhs-minitool-cover-layout
          path: build/xhs-minitool-cover-layout.zip
          if-no-files-found: error
          retention-days: 30